<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Providers - Iroha Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Retained shadow for controls/modals only, as requested */
        .shadow-control {
            box-shadow: 0px 2px 3px -1px rgba(0,0,0,0.1), 0px 1px 0px 0px rgba(25,28,33,0.02), 0px 0px 0px 1px rgba(25,28,33,0.08);
        }
        .shadow-modal {
            box-shadow: 0 2.8px 2.2px rgba(0, 0, 0, 0.034), 0 6.7px 5.3px rgba(0, 0, 0, 0.048), 0 12.5px 10px rgba(0, 0, 0, 0.06), 0 22.3px 17.9px rgba(0, 0, 0, 0.072), 0 41.8px 33.4px rgba(0, 0, 0, 0.086), 0 100px 80px rgba(0, 0, 0, 0.12);
        }

        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Subtle scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body class="antialiased text-gray-900 bg-[#fafafa] flex h-screen overflow-hidden selection:bg-blue-100 selection:text-blue-900">

    <!-- Sidebar -->
    <aside class="hidden md:flex flex-col w-64 border-r border-gray-200/80 bg-white pt-6 pb-4 px-4 flex-shrink-0 z-10 relative">
        <div class="flex items-center gap-3 px-2 mb-10">
            <div class="w-8 h-8 rounded-lg bg-gray-900 text-white flex items-center justify-center shadow-control">
                <i data-lucide="layers" class="w-4 h-4"></i>
            </div>
            <span class="font-semibold tracking-tight text-lg">Iroha</span>
        </div>

        <nav class="flex-1 space-y-1">
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50/80 hover:text-gray-900 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="layout-dashboard" class="w-4 h-4 text-gray-400"></i>
                Dashboard
            </a>
            <a href="#" class="flex items-center justify-between px-3 py-2 text-sm font-medium text-gray-900 bg-gray-100/50 rounded-md transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <div class="flex items-center gap-3">
                    <i data-lucide="network" class="w-4 h-4 text-[#3FA2F6]"></i>
                    Connections
                </div>
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50/80 hover:text-gray-900 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="route" class="w-4 h-4 text-gray-400"></i>
                Routing Rules
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50/80 hover:text-gray-900 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="activity" class="w-4 h-4 text-gray-400"></i>
                Logs & Metrics
            </a>
        </nav>

        <div class="mt-auto space-y-1">
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50/80 hover:text-gray-900 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="book-open" class="w-4 h-4 text-gray-400"></i>
                Documentation
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50/80 hover:text-gray-900 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                <i data-lucide="settings" class="w-4 h-4 text-gray-400"></i>
                Settings
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto relative">
        
        <!-- Mobile Header -->
        <div class="md:hidden flex items-center justify-between p-4 border-b border-gray-200/80 bg-white">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded bg-gray-900 text-white flex items-center justify-center shadow-control">
                    <i data-lucide="layers" class="w-3 h-3"></i>
                </div>
                <span class="font-semibold tracking-tight">Iroha</span>
            </div>
            <button class="p-2 text-gray-500 hover:text-gray-900 rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" aria-label="Open menu">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-12">
            
            <!-- Page Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <h1 class="text-3xl font-semibold tracking-tight text-gray-900">Provider Connections</h1>
                <button onclick="toggleModal('addProviderModal')" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-[#3FA2F6] hover:bg-[#3490de] text-white text-sm font-medium rounded-lg shadow-control transition-colors duration-200 min-h-[44px] sm:min-h-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#3FA2F6]">
                    New connection
                </button>
            </div>

            <!-- Provider List -->
            <div class="space-y-3">
                
                <!-- Connection: OpenAI -->
                <div class="bg-white rounded-xl border border-gray-200">
                    <button onclick="toggleKeys('keys-openai')" class="w-full flex flex-col sm:flex-row sm:items-center justify-between p-4 hover:bg-gray-50/50 transition-colors text-left rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-500 gap-3 sm:gap-0" aria-expanded="false">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-gray-50 border border-gray-100 flex items-center justify-center flex-shrink-0 text-gray-700">
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A6.0651 6.0651 0 0 0 19.0192 19.82a5.9847 5.9847 0 0 0 3.9977-2.9 6.0462 6.0462 0 0 0-.735-7.0988zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.8956zm16.0993 3.8558L12.5973 8.3829a.0804.0804 0 0 1 .0332-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.1408 1.6464 4.4708 4.4708 0 0 1 .5346 3.0137l-.1416-.0852-4.783-2.7582a.7712.7712 0 0 0-.7806 0l-5.8428 3.3685v-2.3324l.0006 2.3324zm-1.12-3.8558a4.485 4.485 0 0 1-2.3655 1.9728V4.1818a.7664.7664 0 0 0-.3879-.6765L8.7523.151a.0757.0757 0 0 1 .071 0l4.8303 2.7865a4.504 4.504 0 0 1 3.6666 4.9123zm-3.218 2.0526l-2.102-1.2132-2.102 1.2132V8.6722l2.102-1.2133 2.102 1.2133v2.4276z"/>
                                </svg>
                            </div>
                            <span class="font-medium text-gray-900">OpenAI</span>
                        </div>
                        <div class="flex items-center gap-6">
                            <span class="text-sm text-gray-500">2 keys</span>
                            <div class="flex items-center gap-2 text-sm text-gray-700 w-24 sm:w-auto">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                                Degraded
                            </div>
                        </div>
                    </button>
                    <!-- Expandable Keys -->
                    <div id="keys-openai" class="hidden border-t border-gray-100 bg-gray-50/40">
                        <div class="flex items-center justify-between py-3 px-4 sm:pl-[3.25rem] sm:pr-8 border-b border-gray-100/50 last:border-0">
                            <span class="font-mono text-sm text-gray-600">sk-proj-…8x2f</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-white text-gray-700 border border-gray-200">
                                Active
                            </span>
                        </div>
                        <div class="flex items-center justify-between py-3 px-4 sm:pl-[3.25rem] sm:pr-8 border-b border-gray-100/50 last:border-0">
                            <span class="font-mono text-sm text-gray-600">sk-proj-…1a9c</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-white text-gray-700 border border-gray-200">
                                Exhausted
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Connection: Anthropic -->
                <div class="bg-white rounded-xl border border-gray-200">
                    <button onclick="toggleKeys('keys-anthropic')" class="w-full flex flex-col sm:flex-row sm:items-center justify-between p-4 hover:bg-gray-50/50 transition-colors text-left rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-500 gap-3 sm:gap-0" aria-expanded="false">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-[#F0EBE1] border border-[#E5E1D8] flex items-center justify-center flex-shrink-0 text-gray-900 font-serif font-bold text-sm leading-none">
                                A
                            </div>
                            <span class="font-medium text-gray-900">Anthropic</span>
                        </div>
                        <div class="flex items-center gap-6">
                            <span class="text-sm text-gray-500">1 key</span>
                            <div class="flex items-center gap-2 text-sm text-gray-700 w-24 sm:w-auto">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                Healthy
                            </div>
                        </div>
                    </button>
                    <!-- Expandable Keys -->
                    <div id="keys-anthropic" class="hidden border-t border-gray-100 bg-gray-50/40">
                        <div class="flex items-center justify-between py-3 px-4 sm:pl-[3.25rem] sm:pr-8 border-b border-gray-100/50 last:border-0">
                            <span class="font-mono text-sm text-gray-600">sk-ant-…3b12</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-white text-gray-700 border border-gray-200">
                                Active
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Connection: Mistral -->
                <div class="bg-white rounded-xl border border-gray-200">
                    <button onclick="toggleKeys('keys-mistral')" class="w-full flex flex-col sm:flex-row sm:items-center justify-between p-4 hover:bg-gray-50/50 transition-colors text-left rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-500 gap-3 sm:gap-0" aria-expanded="false">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-orange-50 border border-orange-100 text-orange-500 flex items-center justify-center flex-shrink-0">
                                <i data-lucide="wind" class="w-4 h-4"></i>
                            </div>
                            <span class="font-medium text-gray-900">Mistral</span>
                        </div>
                        <div class="flex items-center gap-6">
                            <span class="text-sm text-gray-500">3 keys</span>
                            <div class="flex items-center gap-2 text-sm text-gray-700 w-24 sm:w-auto">
                                <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                                Disabled
                            </div>
                        </div>
                    </button>
                    <!-- Expandable Keys -->
                    <div id="keys-mistral" class="hidden border-t border-gray-100 bg-gray-50/40">
                        <div class="flex items-center justify-between py-3 px-4 sm:pl-[3.25rem] sm:pr-8 border-b border-gray-100/50 last:border-0">
                            <span class="font-mono text-sm text-gray-600">V2A…88zq</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-white text-gray-700 border border-gray-200">
                                Active
                            </span>
                        </div>
                        <div class="flex items-center justify-between py-3 px-4 sm:pl-[3.25rem] sm:pr-8 border-b border-gray-100/50 last:border-0">
                            <span class="font-mono text-sm text-gray-600">X9B…21pl</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-white text-gray-700 border border-gray-200">
                                Active
                            </span>
                        </div>
                        <div class="flex items-center justify-between py-3 px-4 sm:pl-[3.25rem] sm:pr-8 border-b border-gray-100/50 last:border-0">
                            <span class="font-mono text-sm text-gray-600">M1C…44qw</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-white text-gray-700 border border-gray-200">
                                Exhausted
                            </span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Add Provider Modal -->
    <div id="addProviderModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-0 opacity-0 pointer-events-none transition-opacity duration-300 ease-in-out" aria-modal="true" role="dialog">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-900/10 backdrop-blur-sm transition-opacity" aria-hidden="true" onclick="toggleModal('addProviderModal')"></div>
        
        <!-- Modal Panel -->
        <div class="bg-white rounded-2xl shadow-modal w-full max-w-md relative transform scale-95 transition-transform duration-300 ease-out" id="modalPanel">
            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold tracking-tight text-gray-900">New Connection</h2>
                    <button onclick="toggleModal('addProviderModal')" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" aria-label="Close modal">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <form class="space-y-5">
                    <div>
                        <label for="provider" class="block text-sm font-medium text-gray-900 mb-1.5">Provider Type</label>
                        <div class="relative">
                            <select id="provider" class="block w-full rounded-lg border-gray-200 py-2.5 pl-3 pr-10 text-sm focus:border-blue-500 focus:ring-blue-500 shadow-control appearance-none bg-white text-gray-900 outline-none transition-shadow border">
                                <option>OpenAI</option>
                                <option>Anthropic</option>
                                <option>Mistral</option>
                                <option>Cohere</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="apiKey" class="block text-sm font-medium text-gray-900 mb-1.5">API Key</label>
                        <input type="password" id="apiKey" placeholder="sk-..." class="block w-full rounded-lg border border-gray-200 py-2.5 px-3 text-sm focus:border-blue-500 focus:ring-blue-500 outline-none shadow-control transition-shadow font-mono placeholder:font-sans placeholder:text-gray-400 text-gray-900">
                    </div>

                    <div class="pt-4 flex items-center justify-end gap-3">
                        <button type="button" onclick="toggleModal('addProviderModal')" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-50 transition-colors min-h-[44px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                            Cancel
                        </button>
                        <button type="button" class="px-4 py-2 text-sm font-medium text-white bg-[#3FA2F6] hover:bg-[#3490de] rounded-lg shadow-sm transition-colors min-h-[44px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#3FA2F6]">
                            Verify & Add
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Toggle Keys List
        function toggleKeys(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                // Optional: set aria-expanded true on the button
            } else {
                el.classList.add('hidden');
                // Optional: set aria-expanded false on the button
            }
        }

        // Modal toggle logic
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            const panel = document.getElementById('modalPanel');
            const isHidden = modal.classList.contains('opacity-0');
            
            if (isHidden) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                panel.classList.remove('scale-95');
                panel.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
                panel.classList.remove('scale-100');
                panel.classList.add('scale-95');
            }
        }
    </script>
</body>
</html>
